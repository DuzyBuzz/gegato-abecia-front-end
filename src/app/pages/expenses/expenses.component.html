<div class="expenses-shell">
	<div class="expenses-shell">
		<p-toast></p-toast>
		<p-confirmDialog></p-confirmDialog>

		<div class="cash-expenses-card">
			<header class="cash-expenses-header">
				<div class="cash-expenses-header__left">
					<div class="expenses-eyebrow">Accounting Workspace</div>
					<h1>Cash Expenses</h1>
				</div>
				<div class="cash-expenses-header__actions">
					<button pButton type="button" label="New Expense" icon="pi pi-plus" class="p-button-sm" (click)="openNewExpenseDialog()"></button>
					<button pButton type="button" label="New Category" icon="pi pi-sitemap" class="p-button-sm p-button-outlined" (click)="openNewCategoryDialog()"></button>
				</div>
			</header>

			<ng-container *ngIf="!canViewExpenses">
				<div class="access-note">You do not have access to this workspace.</div>
			</ng-container>

			<ng-container *ngIf="canViewExpenses">
				<section class="ledger-panel">
					<!-- <div class="ledger-toolbar">
						<div>
							<strong>Cash Expenses Ledger</strong>
							<span>{{ rowCount }} row{{ rowCount === 1 ? '' : 's' }}</span>
						</div>
					</div> -->

					<div class="ledger-grid-wrap">
						<app-table-helper
							[value]="ledgerTableRows"
							[columns]="ledgerColumns"
							[loading]="loading"
							[rows]="50"
							[rowsPerPageOptions]="[10,20,50]"
							[showRowHover]="true"
							[dataKey]="'id'"
							[globalFilterFields]="ledgerGlobalFields"
							[showGlobalFilter]="true"
							[showClearButton]="true"
							[showPrintButton]="true"
							[showExportButton]="true"
							[exportFileName]="'expenses-ledger'"
							[printTitle]="'Expenses Ledger'"
							(onSearch)="onTableSearch($event)"
						>
							<ng-template #rowActions let-row>
								<div class="row-actions">
									<button pButton type="button" icon="pi pi-pen-to-square" label="Edit" class="p-button-text p-button-sm" (click)="openEditExpenseDialog(row)"></button>
								<button pButton type="button" icon="pi pi-trash" label="Delete" class="p-button-text p-button-sm" (click)="confirmDeleteExpense(row)"></button>
								</div>
							</ng-template>
						</app-table-helper>
					</div>
				</section>
<!-- 
				<section class="categories-panel">
					<div class="categories-toolbar">
						<strong>Expense Categories</strong>
					</div>

					<div class="categories-grid-wrap">
						<app-table-helper
							[value]="categories"
							[columns]="[ { field: 'category', header: 'Category' }, { field: 'subCategories', header: 'Subcategories', template: 'text' } ]"
							[loading]="categoriesLoading"
							[rows]="10"
							[dataKey]="'id'"
						>
							<ng-template #rowActions let-row>
								<div class="row-actions">
									<button pButton type="button" icon="pi pi-pen-to-square" label="Edit" class="p-button-text p-button-sm" (click)="openEditCategoryDialog(row)"></button>
									<button pButton type="button" icon="pi pi-trash" label="Delete" class="p-button-text p-button-sm p-button-danger" (click)="confirmDeleteCategory(row)"></button>
								</div>
							</ng-template>
						</app-table-helper>
					</div>
				</section> -->
			</ng-container>

			<app-expenses-form-dialog
				[visible]="expenseDialogVisible"
				[expense]="editingExpense"
				[categories]="categories"
				[fundSourceOptions]="fundSourceOptions"
				[taxTypeOptions]="taxTypeOptions"
				[receiptTypeOptions]="receiptTypeOptions"
				(saved)="onExpenseDialogSaved()"
				(cancelled)="onExpenseDialogCancelled()"
			></app-expenses-form-dialog>

			<app-category-form-dialog
				[visible]="categoryDialogVisible"
				[categories]="categories"
				[category]="editingCategory"
				(saved)="onCategoryDialogSaved()"
				(cancelled)="onCategoryDialogCancelled()"
			></app-category-form-dialog>
		</div>
	</div>

<p-dialog [(visible)]="visible" [modal]="true" [appendTo]="'body'" [baseZIndex]="1100" [style]="{ width: 'min(900px, 96vw)' }" header="Expense Entry" (onHide)="cancel()">
  <div class="dialog-shell">
    <section class="dialog-card">
      <div class="dialog-card__header">
        <div>
          <p class="eyebrow">Expense Entry</p>
          <h3>Capture the expense details in a clean, structured form.</h3>
          <p class="subtle">The entry date falls back to today when no date is supplied.</p>
        </div>
      </div>

      <div class="dialog-grid">
        <div class="field-block">
          <label>Entry Date</label>
          <input pInputText type="date" [(ngModel)]="model.entryDate" [ngModelOptions]="{ standalone: true }" />
        </div>
        <div class="field-block">
          <label>Receipt Date</label>
          <input pInputText type="date" [(ngModel)]="model.receiptDate" [ngModelOptions]="{ standalone: true }" />
        </div>
        <div class="field-block">
          <label>Category</label>
          <p-select [options]="categories" optionLabel="category" optionValue="category" placeholder="Select Category" [(ngModel)]="model.category" (onChange)="onCategorySelectionChange()" [ngModelOptions]="{ standalone: true }"></p-select>
        </div>
        <div class="field-block">
          <label>Subcategory</label>
          <p-select [options]="availableSubCategories" placeholder="Select Subcategory" [(ngModel)]="model.categorySub" [disabled]="!availableSubCategories.length" [ngModelOptions]="{ standalone: true }"></p-select>
        </div>
        <div class="field-block wide">
          <label>Particular</label>
          <input pInputText [(ngModel)]="model.particular" [ngModelOptions]="{ standalone: true }" placeholder="What was this expense for?" />
        </div>
        <div class="field-block">
          <label>Fund Source</label>
          <app-select-helper
            size="md"
            [allowDefaultSelection]="true"
            comboboxName="expenseFundSource"
            [(ngModel)]="model.fundSource"
            [ngModelOptions]="{ standalone: true }"
          ></app-select-helper>
        </div>
        <div class="field-block">
          <label>Tax Type</label>
          <app-select-helper
            size="md"
            [allowDefaultSelection]="true"
            comboboxName="expenseTaxType"
            [(ngModel)]="model.taxType"
            [ngModelOptions]="{ standalone: true }"
          ></app-select-helper>
        </div>
        <div class="field-block">
          <label>Type of Receipt</label>
          <app-select-helper
            size="md"
            [allowDefaultSelection]="true"
            comboboxName="expenseReceiptType"
            [(ngModel)]="model.typeOfReceipt"
            [ngModelOptions]="{ standalone: true }"
          ></app-select-helper>
        </div>
        <div class="field-block">
          <label>Receipt No.</label>
          <input pInputText [(ngModel)]="model.receiptNo" [ngModelOptions]="{ standalone: true }" placeholder="Optional reference" />
        </div>
        <div class="field-block">
          <label>Cash Amount</label>
          <input pInputText type="number" [(ngModel)]="model.amount" [ngModelOptions]="{ standalone: true }" placeholder="0.00" />
        </div>
        <div class="field-block wide">
          <label>Notes</label>
          <input pInputText [(ngModel)]="model.remarks" [ngModelOptions]="{ standalone: true }" placeholder="Any extra notes or remarks" />
        </div>

        <div class="dialog-actions wide">
          <button pButton type="button" label="Cancel" class="p-button-text" (click)="cancel()"></button>
          <button pButton type="button" label="Save Expense" icon="pi pi-save" (click)="save()" [loading]="saving"></button>
        </div>
      </div>
    </section>
  </div>
</p-dialog>
